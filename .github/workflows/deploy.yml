name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # Reuse CI checks before deploy — frontend + backend must pass
  gate:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Ubuntu VPS
    needs: gate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.VPS_PORT || 22 }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy via SSH (pull + build on server)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          ssh -p $VPS_PORT $VPS_USER@$VPS_HOST << 'EOSSH'
          set -e
          cd ${{ secrets.VPS_PATH }}
          echo "==> Pull latest main"
          git fetch origin main
          git reset --hard origin/main

          echo "==> Maintenance ON"
          php artisan down --render="errors::503" --retry=60 || true

          echo "==> PHP deps"
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

          echo "==> Node build"
          # Node 22 must be installed on VPS per DEPLOY_UBUNTU_MANUAL.md Step 5d (actual: v22.23.2)
          if command -v npm >/dev/null 2>&1; then
            npm ci --prefer-offline
            npm run build
          else
            echo "ERROR: npm not found on VPS — install Node 22"; exit 1
          fi

          echo "==> Laravel optimize"
          php artisan migrate --force
          php artisan storage:link || true
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan queue:restart || true

          echo "==> Permissions (Ubuntu www-data)"
          # ROOT CAUSE: Manual deploy Step 13 did 'chown www-data:www-data' — now wikidonate can't chmod (Operation not permitted).
          # FIX 1 (best): Keep deploy user as owner, www-data as group, so both can write without sudo each time.
          # One-time VPS fix (run once as root, see message below):
          #   sudo usermod -aG www-data wikidonate
          #   sudo chown -R $(whoami):www-data storage bootstrap/cache public/build
          #   sudo chmod -R 775 storage bootstrap/cache
          #   sudo chmod -R g+s storage bootstrap/cache
          #   echo "wikidonate ALL=(ALL) NOPASSWD: /bin/chown, /bin/chmod, /usr/bin/supervisorctl, /bin/systemctl" | sudo tee /etc/sudoers.d/wikidonate-deploy
          DEPLOY_USER=$(whoami)
          if sudo -n chown -R $DEPLOY_USER:www-data storage bootstrap/cache public/build 2>/dev/null; then
            echo "chown $DEPLOY_USER:www-data via sudo OK"
          elif chown -R $DEPLOY_USER:www-data storage bootstrap/cache public/build 2>/dev/null; then
            echo "chown $DEPLOY_USER:www-data without sudo OK"
          elif sudo -n chown -R www-data:www-data storage bootstrap/cache public/build 2>/dev/null; then
            echo "chown www-data:www-data via sudo OK (fallback)"
          else
            echo "⚠️ chown failed (no sudo?) — deploy will continue but run one-time fix on VPS (see above)"
          fi
          if sudo -n chmod -R 775 storage bootstrap/cache 2>/dev/null; then
            echo "chmod 775 via sudo OK"
          elif chmod -R 775 storage bootstrap/cache 2>/dev/null; then
            echo "chmod 775 without sudo OK"
          else
            echo "⚠️ chmod failed — will continue. Fix on VPS: sudo chown -R $DEPLOY_USER:www-data storage bootstrap/cache && sudo chmod -R 775 storage bootstrap/cache"
          fi
          sudo -n chmod -R g+s storage/bootstrap/cache 2>/dev/null || sudo -n chmod -R g+ws storage bootstrap/cache 2>/dev/null || true

          echo "==> Maintenance OFF"
          php artisan up

          echo "==> Health check"
          curl -fsS http://127.0.0.1/up || curl -fsS https://wikidonate.org/up || echo "health check warning"
          EOSSH

      - name: Notify
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Deploy succeeded to ${{ secrets.VPS_HOST }}"
          else
            echo "❌ Deploy failed"
            exit 1
          fi
